name: PR Check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pr-check-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PICO_SDK_VERSION: "2.3.0"
  PICO_SDK_REVISION: "98a542c1a62fb549ffb5d66a3e5892b06276b670"
  PICO_SDK_PATH: ${{ github.workspace }}/.pico-sdk

jobs:
  format:
    name: Formatting and syntax
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install formatting dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format

      - name: Syntax-check Python tools
        run: tools/test/syntax-check-python.sh

      - name: Syntax-check shell tools
        run: tools/test/syntax-check-shell.sh

      - name: Check firmware invariants
        run: tools/test/check-firmware-invariants.sh

      - name: Check C formatting
        env:
          FORMAT_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: tools/test/check-clang-format.sh --base "$FORMAT_BASE" --head "${{ github.sha }}"

  unit-tests:
    name: Host tests and coverage
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake gcovr ninja-build

      - name: Run host unit tests
        run: tools/test/test-firmware-c.sh --build-dir firmware/build/tests-pr

      - name: Generate host coverage report
        run: tools/test/coverage-firmware-c.sh --build-dir firmware/build/tests-coverage-pr --output-dir firmware/build/tests-coverage-pr/coverage

      - name: Check firmware invariants
        run: tools/test/check-firmware-invariants.sh

      - name: Upload host coverage report
        uses: actions/upload-artifact@v6
        with:
          name: pico-pwm-pr-coverage
          path: firmware/build/tests-coverage-pr/coverage
          if-no-files-found: error

  host-tools:
    name: Python and .NET host tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test Python host
        working-directory: host/python
        run: |
          python -m pip install -e '.[test]'
          python -m pytest -q

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Test .NET host
        working-directory: host/dotnet
        run: dotnet test PicoPwm.sln --configuration Release

  firmware:
    name: Firmware (${{ matrix.board }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        board: [pico, pico2]

    env:
      BOARD: ${{ matrix.board }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-dev libstdc++-arm-none-eabi-newlib

      - name: Cache Pico SDK
        uses: actions/cache@v5
        with:
          path: .pico-sdk
          key: pico-sdk-${{ env.PICO_SDK_VERSION }}-${{ env.PICO_SDK_REVISION }}-${{ runner.os }}

      - name: Setup Pico SDK
        run: |
          tools/firmware/setup-sdk-env.sh \
            --sdk-version "$PICO_SDK_VERSION" \
            --sdk-revision "$PICO_SDK_REVISION"

      - name: Build firmware
        run: tools/firmware/build.sh --board "$BOARD"

      - name: Check USB identity
        run: python3 tools/release/check-usb-identity.py

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: pico-pwm-pr-${{ matrix.board }}
          path: |
            firmware/build/${{ matrix.board }}/pico_pwm.uf2
            firmware/build/${{ matrix.board }}/pico_pwm.elf
            firmware/build/${{ matrix.board }}/pico_pwm.bin
            firmware/build/${{ matrix.board }}/pico_pwm.hex
            firmware/build/${{ matrix.board }}/pico_pwm.dis
          if-no-files-found: error