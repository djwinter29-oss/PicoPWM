name: Host Validation

on:
  workflow_call:

permissions:
  contents: read

jobs:
  host-unit-tests:
    name: Host tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        python: ["3.10", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Setup Node.js
        if: matrix.python == '3.12'
        uses: actions/setup-node@v7
        with:
          node-version: "22.x"

      - name: Setup .NET
        if: matrix.python == '3.12'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install Linux HID system dependency
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libhidapi-dev

      - name: Install macOS HID system dependency
        if: runner.os == 'macOS'
        run: brew install hidapi

      - name: Install Python host and test dependencies
        run: python -m pip install --disable-pip-version-check --no-input --editable "host/python[test]"

      - name: Run all host tests
        if: matrix.python == '3.12'
        env:
          PYTHON: python
        shell: bash
        run: bash tools/test/test-host.sh

      - name: Test minimum Python version
        if: matrix.python == '3.10'
        run: python -m pytest -q host/python/tests
