name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: Release version without leading v
        required: true
        type: string

permissions:
  contents: read

env:
  PICO_SDK_VERSION: "2.3.0"
  PICO_SDK_REVISION: "98a542c1a62fb549ffb5d66a3e5892b06276b670"
  PICO_SDK_PATH: ${{ github.workspace }}/.pico-sdk

jobs:
  build:
    name: Build (${{ matrix.board }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        board: [pico, pico2]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          VERSION=$(tools/release/resolve-release-version.sh "$EVENT_NAME" "$INPUT_VERSION" "$REF_NAME")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved firmware version: $VERSION"

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi

      - name: Cache Pico SDK
        uses: actions/cache@v4
        with:
          path: .pico-sdk
          key: pico-sdk-${{ env.PICO_SDK_VERSION }}-${{ env.PICO_SDK_REVISION }}-${{ runner.os }}

      - name: Setup Pico SDK
        run: |
          tools/firmware/setup-sdk-env.sh \
            --sdk-version "$PICO_SDK_VERSION" \
            --sdk-revision "$PICO_SDK_REVISION"

      - name: Syntax-check Python tools
        run: tools/test/syntax-check-python.sh

      - name: Syntax-check shell tools
        run: tools/test/syntax-check-shell.sh

      - name: Build firmware
        env:
          BOARD: ${{ matrix.board }}
          VERSION: ${{ steps.version.outputs.version }}
        run: tools/firmware/build.sh --board "$BOARD" --firmware-version "$VERSION"

      - name: Check USB identity
        run: python3 tools/release/check-usb-identity.py

      - name: Package board artifacts
        env:
          BOARD: ${{ matrix.board }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          source_dir="firmware/build-${BOARD}"
          output_dir="dist/${BOARD}"
          mkdir -p "$output_dir"
          for extension in uf2 elf bin hex dis; do
            cp "$source_dir/pico_pwm.${extension}" "$output_dir/pico_pwm-v${VERSION}-${BOARD}.${extension}"
          done
          (cd "$output_dir" && sha256sum pico_pwm-v${VERSION}-${BOARD}.* > "SHA256SUMS-${BOARD}.txt")
          ls -la "$output_dir"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.board }}
          path: dist/${{ matrix.board }}/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    if: github.event_name == 'push'

    steps:
      - name: Download all board artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Publish GitHub release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: PicoPWM ${{ github.ref_name }}
          draft: true
          files: |
            dist/**
          generate_release_notes: true