name: Bug Report
description: Report unexpected behavior in firmware or host tools
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Firmware (RP2040/RP2350)
        - USB CDC shell
        - I2C slave
        - USB HID
        - Host Python
        - Host .NET
        - WebHID
        - Build/CI/release tooling
        - Documentation
    validations:
      required: true
  - type: input
    id: board
    attributes:
      label: Board and firmware version
      description: e.g. Pico 2, firmware v0.5.0
  - type: input
    id: config
    attributes:
      label: Bank configuration
      description: Role and backend of banks A, B and C, e.g. A HW generator, B PIO monitor, C SW generator
  - type: textarea
    id: repro
    attributes:
      label: Steps to Reproduce
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Output
      description: CDC shell output, HID status, or CI failure output
      render: shell
