[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "picopwm-host"
version = "0.1.0"
description = "Python host tools and Flask management interface for PicoPWM"
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.0,<4",
    "hidapi>=0.14",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
picopwm-web = "picopwm.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["picopwm*"]

[tool.setuptools.package-data]
picopwm = ["web/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
