name: Publish .NET Packages

on:
  workflow_call:
    inputs:
      release_build:
        description: Preserve the release version when called by the release pipeline
        required: false
        default: true
        type: boolean
      version:
        description: "Release version without leading v; tag pushes resolve their tag instead"
        required: false
        default: ""
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Base version without leading v, for example 1.2.3 (packages are marked as test builds)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    name: Publish .NET Packages (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve PicoPWM version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          TEST_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && !inputs.release_build }}
        run: |
          set -eu
          VERSION=$(tools/release/resolve-release-version.sh "$EVENT_NAME" "$INPUT_VERSION" "$REF_NAME")
          if [ "$TEST_PUBLISH" = true ]; then
            VERSION="${VERSION}-test.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Python for package verification
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Publish standalone PicoPWM
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RID: ${{ matrix.rid }}
        run: |
          dotnet publish host/dotnet/PicoPwm -c Release -r "$RID" --self-contained true \
            -p:Version="$VERSION" -o build/host-release

      - name: Check and archive standalone PicoPWM
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RID: ${{ matrix.rid }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil
          version, rid = os.environ['VERSION'], os.environ['RID']
          root = Path('build/host-release').resolve()
          assert f'PicoPwm/{version}' in json.loads((root / 'PicoPwm.deps.json').read_text())['libraries']
          assert (root / 'wwwroot' / 'index.html').is_file(), 'Dashboard assets missing'
          dist = Path('dist')
          dist.mkdir(exist_ok=True)
          archive_format = 'zip' if rid.startswith('win-') else 'gztar'
          shutil.make_archive(str(dist / f'picopwm-host-v{version}-{rid}'), archive_format, root_dir=root)
          files = sorted(path for path in dist.iterdir() if path.is_file())
          checksums = ''.join(f'{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}\n' for path in files)
          (dist / f'SHA256SUMS-host-{rid}.txt').write_text(checksums, encoding='utf-8')
          PY

      - name: Upload PicoPWM packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-host-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error
