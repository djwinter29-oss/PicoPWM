name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: Release version without leading v
        required: true
        type: string

permissions:
  contents: read

jobs:
  format:
    name: Formatting and syntax
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install formatting dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format

      - name: Syntax-check Python tools
        run: tools/test/syntax-check-python.sh

      - name: Syntax-check shell tools
        run: tools/test/syntax-check-shell.sh

      - name: Check firmware invariants
        run: tools/test/check-firmware-invariants.sh

      - name: Check C formatting
        env:
          FORMAT_BASE: ${{ github.event.before }}
        run: tools/test/check-clang-format.sh --base "$FORMAT_BASE" --head "${{ github.sha }}"

  unit-tests:
    name: Host tests and coverage
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake gcovr ninja-build

      - name: Run host unit tests
        run: tools/test/test-firmware-c.sh --build-dir build/tests-release

      - name: Generate host coverage report
        run: tools/test/coverage-firmware-c.sh --build-dir build/tests-coverage-release --output-dir build/coverage-release

      - name: Check firmware invariants
        run: tools/test/check-firmware-invariants.sh

      - name: Upload host coverage report
        uses: actions/upload-artifact@v6
        with:
          name: pico-pwm-release-coverage
          path: build/coverage-release
          if-no-files-found: error

  host-tools:
    name: Host tests
    uses: ./.github/workflows/host-validation.yml

  dotnet-packages:
    name: Publish .NET Packages
    needs: host-tools
    uses: ./.github/workflows/publish-dotnet.yml
    with:
      version: ${{ inputs.version || '' }}

  python-package:
    name: Package Python
    needs: host-tools
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve host version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          VERSION=$(tools/release/resolve-release-version.sh "$EVENT_NAME" "$INPUT_VERSION" "$REF_NAME")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Python wheel
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" host/python/pyproject.toml
          cp -r host/web host/python/picopwm/web
          python -m pip wheel --no-deps host/python --wheel-dir dist

      - name: Verify installed Python release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          python -m venv build/host-wheel-check
          build/host-wheel-check/bin/python -m pip install dist/*.whl
          cd build
          host-wheel-check/bin/python - <<'PY'
          from importlib.metadata import version
          import os
          from picopwm.app import create_app
          assert version('picopwm-host') == os.environ['VERSION']
          assert create_app(object()).test_client().get('/').status_code == 200
          PY

      - name: Checksum Python wheel
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          dist = Path('dist')
          files = sorted(dist.glob('*.whl'))
          assert len(files) == 1, 'Expected exactly one Python wheel'
          checksums = ''.join(f'{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}\n' for path in files)
          (dist / 'SHA256SUMS-python.txt').write_text(checksums, encoding='utf-8')
          PY

      - name: Upload Python package
        uses: actions/upload-artifact@v6
        with:
          name: release-python
          path: dist/*
          if-no-files-found: error

  build:
    name: Build (${{ matrix.board }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        board: [pico, pico2]

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Resolve version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          VERSION=$(tools/release/resolve-release-version.sh "$EVENT_NAME" "$INPUT_VERSION" "$REF_NAME")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved firmware version: $VERSION"

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-dev libstdc++-arm-none-eabi-newlib

      - name: Build firmware
        env:
          BOARD: ${{ matrix.board }}
          VERSION: ${{ steps.version.outputs.version }}
        run: tools/firmware/build.sh --board "$BOARD" --firmware-version "$VERSION"

      - name: Check USB identity
        run: python3 tools/release/check-usb-identity.py

      - name: Package board artifacts
        env:
          BOARD: ${{ matrix.board }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          source_dir="build/${BOARD}"
          output_dir="dist/${BOARD}"
          mkdir -p "$output_dir"
          for extension in uf2 elf bin hex dis; do
            cp "$source_dir/pico_pwm.${extension}" "$output_dir/pico_pwm-v${VERSION}-${BOARD}.${extension}"
          done
          (cd "$output_dir" && sha256sum pico_pwm-v${VERSION}-${BOARD}.* > "SHA256SUMS-${BOARD}.txt")
          ls -la "$output_dir"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.board }}
          path: dist/${{ matrix.board }}/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [build, format, unit-tests, host-tools, python-package, dotnet-packages]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    # Manual runs build artifacts only; tag pushes publish a release.
    if: github.event_name == 'push'

    steps:
      - name: Checkout release gate
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Require successful PR checks
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: python3 tools/release/require_release_checks.py --sha "$SOURCE_SHA"

      - name: Download all board artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Publish GitHub release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: PicoPWM ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true