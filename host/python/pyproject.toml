[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.5"]
build-backend = "hatchling.build"

[project]
name = "picopwm"
dynamic = ["version"]
description = "Python host tools and Flask management interface for PicoPWM"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{name = "Ji Dong"}]
keywords = ["picopwm", "raspberry-pi-pico", "pwm", "usb-hid", "dashboard"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: System :: Hardware",
]
dependencies = [
    "Flask>=3.0,<4",
    "hidapi>=0.14",
]

[project.urls]
Homepage = "https://github.com/djwinter29-oss/PicoPWM"
Documentation = "https://github.com/djwinter29-oss/PicoPWM/blob/main/host/python/README.md"
Repository = "https://github.com/djwinter29-oss/PicoPWM"
Issues = "https://github.com/djwinter29-oss/PicoPWM/issues"
Changelog = "https://github.com/djwinter29-oss/PicoPWM/releases"

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
picopwm = "picopwm.dashboard.app:main"
picopwm-web = "picopwm.dashboard.app:main"

[tool.hatch.version]
source = "vcs"
tag-pattern = '^v(?P<version>\d+\.\d+\.\d+)$'

[tool.hatch.version.raw-options]
root = "../.."
git_describe_command = "git describe --dirty --tags --long --match v[0-9]*.[0-9]*.[0-9]*"

[tool.hatch.build]
artifacts = ["picopwm/web/**"]

[tool.hatch.build.targets.wheel]
packages = ["picopwm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
